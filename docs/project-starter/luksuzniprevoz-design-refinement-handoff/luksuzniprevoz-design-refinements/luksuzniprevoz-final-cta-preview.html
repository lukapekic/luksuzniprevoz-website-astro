:root{color-scheme:dark;--background:#08090a;--text:#f3f3f0;--muted:#b5b7ba;--accent:#b8bcc2;--accent-hover:#d0d3d7;--text-on-light:#17191b;--border:#5b6067;--gutter:clamp(1rem,3vw,2rem)}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--text);font-family:"Manrope",sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100svh;display:grid;align-content:center;padding-block:3rem}
.final-cta{position:relative;isolation:isolate;overflow:hidden;background:var(--background)}
.final-cta__image{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:50% 14%;opacity:1;filter:none}
.final-cta__scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(8,9,10,.96) 0%,rgba(8,9,10,.85) 25%,rgba(8,9,10,.65) 42%,rgba(8,9,10,.12) 66%,rgba(8,9,10,.03) 100%);pointer-events:none}
.final-cta__container{width:100%;max-width:80rem;margin-inline:auto;padding-inline:var(--gutter);min-height:26.25rem;display:flex;align-items:center;padding-block:4rem}
.final-cta__content{width:min(100%,32rem);min-width:0;overflow-wrap:anywhere}
h2{margin:0;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:clamp(2.25rem,3.4vw,3.25rem);line-height:1.06;letter-spacing:-.035em;text-wrap:balance}
.final-cta__description{max-width:29rem;margin:1.25rem 0 0;font-size:1rem;line-height:1.75;color:var(--text)}
.final-cta__actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
.button{display:inline-flex;align-items:center;justify-content:center;gap:.875rem;min-height:3rem;padding:.75rem 1.125rem;border:1px solid transparent;border-radius:6px;text-decoration:none;font-size:.875rem;font-weight:650;line-height:1.4;transition:background-color .15s,color .15s,border-color .15s}
.button--primary{background:var(--accent);color:var(--text-on-light)}
.button--primary:hover{background:var(--accent-hover)}
.button--secondary{background:rgba(8,9,10,.4);border-color:var(--border);color:var(--text)}
.button--secondary:hover{background:#1a1d20;border-color:var(--accent)}
.button span{min-width:0;overflow-wrap:anywhere}
.button svg{width:1rem;height:1rem;flex:none}
.final-cta__contacts{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin:1rem 0 0;padding:0;list-style:none}
.final-cta__contacts li{max-width:100%}
.final-cta__contacts a{display:flex;align-items:center;gap:.5rem;min-height:2.75rem;color:var(--muted);font-size:.8125rem;line-height:1.5;text-decoration:none;overflow-wrap:anywhere}
.final-cta__contacts a:hover{color:var(--text);text-decoration:underline;text-underline-offset:.25em}
.final-cta__contacts svg{height:1rem;width:1rem;flex:none}
a:focus-visible{outline:2px solid var(--text);outline-offset:5px}
@media(max-width:63.999rem){
 .final-cta__container{padding-top:16rem;padding-bottom:2.5rem;min-height:0;align-items:flex-end}
 .final-cta__content{width:min(100%,34rem)}
 .final-cta__image{object-position:70% 0%}
 .final-cta__scrim{background:linear-gradient(180deg,rgba(8,9,10,.04) 0%,rgba(8,9,10,.06) 23%,rgba(8,9,10,.80) 42%,rgba(8,9,10,.96) 60%,rgba(8,9,10,.99) 100%)}
 h2{font-size:clamp(2.25rem,5vw,3rem)}
}
@media(max-width:29.999rem){
 main{padding-block:1.5rem}
 .final-cta__container{padding-top:14rem;padding-bottom:2rem}
 .final-cta__actions{flex-direction:column}
 .button{width:100%}
 .final-cta__contacts{gap:0;flex-direction:column;margin-top:1rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
