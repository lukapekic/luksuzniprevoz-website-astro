name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-fast:
    # Preserve the existing required-check name while consolidating its work.
    name: quality-fast
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        # No `version`: action-setup reads `packageManager` from package.json.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality:page
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
