name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        # No `version`: action-setup reads `packageManager` from package.json.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install pinned browser engines for the required UI evidence
        run: pnpm --filter @luksuzni-prevoz/site exec playwright install --with-deps chromium firefox webkit

      # Static release gate: generated-artifact drift, design governance,
      # content/SEO, typing, lint, unit tests, build, secret scan, and dep audit.
      # Browser-based visual/responsive review remains a deliberate manual gate.
      - run: pnpm quality:release
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Run browser accessibility evidence against the production build
        run: pnpm test:a11y
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
