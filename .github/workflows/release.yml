name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        # No `version`: action-setup reads `packageManager` from package.json.
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      # Install Playwright browsers + OS deps so the e2e/a11y tiers run.
      - run: pnpm --filter @luksuzni-prevoz/site exec playwright install --with-deps chromium

      # Full release gate: quality:fast → build → drift checks → traceability
      # → waivers → secret scan → dep audit → e2e → a11y → Lighthouse.
      - run: pnpm quality:release
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      # Create release PR or publish via changesets
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
